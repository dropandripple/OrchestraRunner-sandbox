name: ci
on:
  push:
    branches: [main, 'orchestra/candidate/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: ${{ !startsWith(github.ref_name, 'orchestra/candidate/skip-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -t . -v
